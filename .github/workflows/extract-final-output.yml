name: Extract FINAL_OUTPUT

on:
  push:
    branches:
      - main
    paths:
      - FINAL_OUTPUT.zip
      - .github/workflows/extract-final-output.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract landing variants
        shell: bash
        run: |
          set -euo pipefail

          test -f FINAL_OUTPUT.zip

          workdir="$(mktemp -d)"
          unzip -q FINAL_OUTPUT.zip -d "$workdir"

          rm -rf \
            credibil-public-landing \
            credibil-scroll-story \
            credibil-site-v3 \
            credibil-wow-site \
            credibil-bolt-vite \
            credibil-section \
            project-bolt-sb1-3bvarghr

          cp -a "$workdir/credibil-public-landing" ./credibil-public-landing
          cp -a "$workdir/credibil-scroll-story" ./credibil-scroll-story
          cp -a "$workdir/credibil-site-v3" ./credibil-site-v3
          cp -a "$workdir/credibil-wow-site" ./credibil-wow-site
          cp -a "$workdir/credibil-section" ./credibil-section
          cp -a "$workdir/project-bolt-sb1-3bvarghr/project" ./credibil-bolt-vite

          rm -rf \
            credibil-scroll-story/credibil-scroll-story \
            credibil-wow-site/credibil-wow-site

          cat > README.md <<'EOF'
          # Credibil landing variants

          Repository with five independent Credibil landing-page concepts and one standalone section example.

          ## Structure

          - `credibil-public-landing` - static HTML/CSS/JS landing.
          - `credibil-scroll-story` - static storytelling landing.
          - `credibil-site-v3` - application-based landing source.
          - `credibil-wow-site` - static visual landing.
          - `credibil-bolt-vite` - React/Vite landing.
          - `credibil-section` - standalone section example.
          - `index.html` - repository landing selector.
          - `FINAL_OUTPUT.zip` - original source archive.
          EOF

          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Credibil - варианты лендинга</title>
            <style>
              :root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f7fb}
              *{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:64px 24px}
              h1{font-size:clamp(36px,6vw,72px);line-height:1;margin:0 0 18px}.lead{font-size:20px;color:#5b6578;max-width:760px;margin:0 0 42px}
              .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{display:flex;flex-direction:column;min-height:220px;padding:26px;border:1px solid #dfe5ef;border-radius:22px;background:#fff;text-decoration:none;color:inherit;box-shadow:0 12px 36px rgba(20,35,60,.06)}
              .card:hover{transform:translateY(-3px);box-shadow:0 18px 46px rgba(20,35,60,.11)}.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4d69ff}.card h2{font-size:25px;margin:18px 0 10px}.card p{color:#667085;line-height:1.55;margin:0}.open{margin-top:auto;padding-top:24px;font-weight:700}
              .note{margin-top:28px;color:#667085;font-size:14px}
            </style>
          </head>
          <body><main class="wrap">
            <h1>Credibil</h1>
            <p class="lead">Пять самостоятельных концепций лендинга и отдельный пример секции. Выберите вариант для просмотра или дальнейшей разработки.</p>
            <section class="grid">
              <a class="card" href="credibil-public-landing/index.html"><span class="tag">Вариант 1</span><h2>Public Landing</h2><p>Статический HTML/CSS/JS-вариант с готовыми изображениями продукта.</p><span class="open">Открыть вариант</span></a>
              <a class="card" href="credibil-scroll-story/index.html"><span class="tag">Вариант 2</span><h2>Scroll Story</h2><p>Сторителлинг и последовательное раскрытие продукта при прокрутке.</p><span class="open">Открыть вариант</span></a>
              <a class="card" href="credibil-site-v3/"><span class="tag">Вариант 3</span><h2>Site V3</h2><p>Исходный проект приложения с отдельной структурой сборки.</p><span class="open">Открыть папку</span></a>
              <a class="card" href="credibil-wow-site/index.html"><span class="tag">Вариант 4</span><h2>WOW Site</h2><p>Визуальная концепция с акцентом на графику, связи и мониторинг.</p><span class="open">Открыть вариант</span></a>
              <a class="card" href="credibil-bolt-vite/"><span class="tag">Вариант 5</span><h2>Bolt React/Vite</h2><p>Компонентный React/Vite-проект для дальнейшей разработки.</p><span class="open">Открыть папку</span></a>
              <a class="card" href="credibil-section/index.html"><span class="tag">Отдельный пример</span><h2>Credibil Section</h2><p>Самостоятельная секция для переноса в итоговый лендинг.</p><span class="open">Открыть секцию</span></a>
            </section>
            <p class="note">React/Vite и application-based варианты требуют локального запуска или отдельной сборки.</p>
          </main></body>
          </html>
          EOF

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Extract FINAL_OUTPUT into five landing variants"
          git push origin main
