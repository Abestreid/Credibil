name: Deploy Credibil

on:
  push:
    branches:
      - dev
      - prod
    paths:
      - "credibil-final-heroes/**"
      - ".github/workflows/deploy-credibil.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credibil-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || 'development' }}

    defaults:
      run:
        working-directory: credibil-final-heroes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: credibil-final-heroes/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production branch
        if: github.ref_name == 'prod'
        env:
          VITE_BASE_PATH: /credibil/
          VITE_DEPLOY_ENV: production
        run: npm run build

      - name: Build development branch
        if: github.ref_name == 'dev'
        env:
          VITE_BASE_PATH: /credibil/dev/
          VITE_DEPLOY_ENV: development
        run: npm run build

      - name: Run tests against build output
        run: npm run test:sites

      - name: Add noindex protection to development build
        if: github.ref_name == 'dev'
        run: |
          cat > dist/client/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF
          find dist/client -type f -name '*.html' -print0 | xargs -0 sed -i 's#</head>#<meta name="robots" content="noindex,nofollow,noarchive"></head>#'

      - name: Select and validate remote directory
        id: target
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            prod)
              target_dir="/test.abeslab.by/credibil/"
              ;;
            dev)
              target_dir="/test.abeslab.by/credibil/dev/"
              ;;
            *)
              echo "Deployment is forbidden for branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

          case "${target_dir}" in
            "/test.abeslab.by/credibil/"|"/test.abeslab.by/credibil/dev/")
              ;;
            *)
              echo "Deployment path is outside the Credibil allowlist: ${target_dir}" >&2
              exit 1
              ;;
          esac

          echo "dir=${target_dir}" >> "$GITHUB_OUTPUT"
          echo "Deployment target validated: ${target_dir}"

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: credibil-final-heroes/dist/client/
          server-dir: ${{ steps.target.outputs.dir }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
