version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      target: production
    ports:
      - "8000:8000"
    environment:
      - CREDIBIL_DATABASE_URL=postgresql+asyncpg://credibil:${DB_PASSWORD}@postgres:5432/credibil
      - CREDIBIL_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CREDIBIL_DEBUG=false
      - CREDIBIL_JWT_SECRET=${JWT_SECRET}
      - CREDIBIL_MEILISEARCH_URL=http://meilisearch:7700
      - CREDIBIL_MEILISEARCH_API_KEY=${MEILISEARCH_MASTER_KEY}
      - CREDIBIL_CORS_ORIGINS=${CORS_ORIGINS:-https://app.credibil.md}
      - CREDIBIL_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CREDIBIL_RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-120}
      - CREDIBIL_RATE_LIMIT_RPH=${RATE_LIMIT_RPH:-5000}
      - CREDIBIL_OTEL_EXPORTER_ENDPOINT=${OTEL_EXPORTER_ENDPOINT:-}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      target: production
    command: celery -A credibil.workers.celery_app worker -l info -c 4 --max-tasks-per-child=1000
    environment:
      - CREDIBIL_DATABASE_URL=postgresql+asyncpg://credibil:${DB_PASSWORD}@postgres:5432/credibil
      - CREDIBIL_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CREDIBIL_MEILISEARCH_URL=http://meilisearch:7700
      - CREDIBIL_MEILISEARCH_API_KEY=${MEILISEARCH_MASTER_KEY}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      target: production
    command: celery -A credibil.workers.celery_app beat -l info
    environment:
      - CREDIBIL_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: credibil
      POSTGRES_USER: credibil
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credibil"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - backend
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.7
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY}
      - MEILI_ENV=production
    networks:
      - backend
    volumes:
      - meilisearch_data:/meili_data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
