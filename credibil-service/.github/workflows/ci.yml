name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
        working-directory: backend
      - name: Ruff check
        run: uv run ruff check .
        working-directory: backend
      - name: Ruff format check
        run: uv run ruff format --check .
        working-directory: backend
      - name: Mypy
        run: uv run mypy src/
        working-directory: backend

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
        working-directory: backend
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        working-directory: backend

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
        working-directory: backend
      - name: Run bandit
        run: uv run bandit -r src/ -c pyproject.toml || true
        working-directory: backend
      - name: Run safety
        run: uv run pip-audit || true
        working-directory: backend

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: |
          docker build \
            --target production \
            -t credibil:${{ github.sha }} \
            -f infrastructure/docker/Dockerfile .
