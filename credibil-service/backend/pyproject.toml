[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credibil"
version = "0.1.0"
description = "Company due diligence SaaS platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29.0,<1.0",
    "alembic>=1.13.0,<2.0",
    "pydantic[email]>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "redis[hiredis]>=5.0.0,<6.0",
    "celery[redis]>=5.4.0,<6.0",
    "httpx>=0.27.0,<1.0",
    "socksio>=1.0.0,<2.0",
    "structlog>=24.1.0,<25.0",
    "python-ulid>=2.2.0,<3.0",
    "bcrypt>=4.1.0,<5.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0,<4.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "meilisearch-python-sdk>=3.0.0,<4.0",
    "prometheus-client>=0.21.0,<1.0",
    "opentelemetry-api>=1.25.0,<2.0",
    "opentelemetry-sdk>=1.25.0,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.46b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0,<1.0",
    "playwright>=1.44.0,<2.0",
    "curl-cffi>=0.7.0,<1.0",
    "reportlab>=4.0.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.4.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "factory-boy>=3.3.0,<4.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/credibil"]

[project.scripts]
sfs-cookies = "credibil.countries.moldova.providers.sfs_cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/credibil/api/**/routes.py" = ["B008"]
"src/credibil/api/auth/**" = ["B008"]
"src/credibil/api/monitoring/**" = ["B008"]
"src/credibil/api/public/**" = ["B008", "TC001", "TC002", "TC003"]
"src/credibil/api/apikey/**" = ["B008", "TC001", "TC002", "TC003"]
"src/credibil/api/v1/*/dependencies.py" = ["B008"]
"src/credibil/workers/**" = ["B904"]
"src/credibil/domain/search/**" = ["A002"]
"src/credibil/application/search/**" = ["A002", "TC001"]
"src/credibil/infrastructure/search/**" = ["TC001"]
"src/credibil/api/v1/search/**" = ["TC001", "B904"]
"src/credibil/api/v1/export/**" = ["N806", "N803"]
"tests/**" = ["TC001", "UP037", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["credibil"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
